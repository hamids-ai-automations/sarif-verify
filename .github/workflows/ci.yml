name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run test suite
        run: python -m unittest discover -s tests -v

      - name: CLI smoke - clean log must pass
        run: sarif-verify check --strict fixtures/good.sarif

      - name: CLI smoke - demo must fail with exit 1
        run: |
          set +e
          python -m sarif_verify.demo
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from the demo, got $code"
            exit 1
          fi

      - name: CLI smoke - JSON output is parseable
        run: |
          set +e
          sarif-verify check --json fixtures/good.sarif > report.json
          set -e
          python -c "import json;json.load(open('report.json'))"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image (includes build-time self-test)
        run: docker build -t sarif-verify:ci .
      - name: Run container against the bundled fixture
        run: docker run --rm sarif-verify:ci check fixtures/good.sarif
